  <div>

<!-- the form -->
  <div class="container"><br>
    
    <div class="content">
      <form action="#">

        <div class="user-details">
          <div class="input-box">
            <span class="details">Full Name</span>
            <input type="text" oninvalid="alert('You must fill out the form!');" placeholder="Enter your name" required>
             <br><br>
            <span class="details">Date of birth</span>
            <input type="date" oninvalid="alert('You must fill out the form!');" placeholder="enter birth date" required>

           <br><br>

            <span class="details">Education Background</span>
            <input type="text" placeholder="High school name" required>
            <input type="text" placeholder="Gradution year" required>
            <input type="grade" placeholder="GPA" required>
            <input type="grade" placeholder="optional sub" required>
            

          </div>

          <div class="input-box">
            <span class="details">Address</span>
            
            <input type="text,number" oninvalid="alert('You must fill out the form!');" placeholder="street address" required>

<br>
<label for="sate">State:</label>

<select name="state" id="state">
  <option value="dhaka">dhaka</option>
  <option value="tokyo">tokyo</option>
  <option value="sydney">sydney</option>
  <option value="delhi">delhi</option>
</select>



<label for="country">country:</label>

<select name="country" id="country">
  <option value="australia">australia</option>
  <option value="japan">japan</option>
  <option value="bangladesh">bangladesh</option>
  <option value="india">india</option>
</select>

            
            <input type="text,number" oninvalid="alert('You must fill out the form!');" placeholder="postel code" required>

<br>
<span class="details">Program Selection</span>
            
<label for="country">Department:</label>

<select name="country" id="country">
  <option value="australia">CSE</option>
  <option value="japan">EEE</option>
  <option value="bangladesh">English</option>
  <option value="india">BBA</option>
</select> 

<br>
<label for="country">Enroll year:</label>

<select name="country" id="country">
  <option value="australia">2020</option>
  <option value="japan">2023</option>
  <option value="bangladesh">2024</option>
  <option value="india">2021</option>
</select>


<br> <br>
<span class="details">Upload your DOC</span>
            
            <input type="file" id="my file " name="my file">
            <input type="submit" value="Upload">




          </div>
          <div class="input-box">
            <span class="details">Email</span>
            <input type="email" id="email" name="email" placeholder="tansin@gmail.com">
          </div>
          <div class="input-box">
            <span class="details">Phone Number</span>
            <input type="tel" id="Phone" name="Phone" placeholder="e.g. +880-">
          </div>
          <div class="input-box">
            <span class="details">Password</span>
            <input type="password" placeholder="Enter your password" required id="password">




          




          
          </div>
          <div class="input-box">
            <span class="details">Confirm Password</span>
            <input type="password" placeholder="Confirm your password" required id="password">
          </div>
        </div>
        <div class="gender-details">
          <input type="radio" name="gender" id="dot-1">
          <input type="radio" name="gender" id="dot-2">
          <input type="radio" name="gender" id="dot-3">
          <span class="gender-title">Gender</span>
          <div class="category">
            <label for="dot-1">

            <span class="gender">Male</span>
          </label>
          <label for="dot-2">
            <span class="dot two"></span>
            <span class="gender">Female</span>
          </label>
          <label for="dot-3">
            <span class="dot three"></span>

            </label>
          </div>
        </div>
        <div class="button">
